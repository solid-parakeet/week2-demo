apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnist-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mnist-app
  template:
    metadata:
      labels:
        app: mnist-app
    spec:
      containers:
      - name: mnist-app
        image: mnist-app
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5050
---
apiVersion: v1
kind: Service
metadata:
  name: mnist-service
spec:
  type: NodePort
  selector:
    app: mnist-app
  ports:
  - port: 5050
    targetPort: 5050
    nodePort: 30080
