services:
  app:
    build:
      context: .              # folder to build from (where your files are)
      dockerfile: Dockerfile  # the Dockerfile Compose runs to build the image
    image: mnist-app          # name given to the image that gets built
    ports:
      - "5050:5050"
    environment:
      DB_HOST: $db
      DB_PASSWORD: demo-password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: demo-password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
